name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  npm-verify:
    name: npm verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Confirm public npm registry
        run: test "$(npm config get registry --location=project)" = "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
